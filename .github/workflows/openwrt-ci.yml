name: Build LEDE (Disk Optimized)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space (Nuclear Clean)
      run: |
        # 1. 停止不需要的服务
        sudo systemctl stop unattended-upgrades
        
        # 2. 删除巨型预装软件 (Android SDK, CodeQL, Dotnet, Haskell)
        echo "Deleting pre-installed software..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/swift
        
        # 3. 清理 Docker 镜像 (GitHub Runner 预装了很多 docker 镜像)
        echo "Pruning Docker images..."
        sudo docker image prune --all --force
        
        # 4. 清理 APT 缓存
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        # 5. 显示剩余空间
        df -hT

    - name: Initialize Environment & Create Swap
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # --- 创建 4GB SWAP (平衡内存与磁盘) ---
        # 之前 8GB 太大导致磁盘满，4GB 足够应对 OpenClash 编译
        echo "Creating 4GB SWAP file..."
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "Swap status:"
        free -h

        # --- 安装编译依赖 ---
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        cd openwrt
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> "feeds.conf.default"
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> "feeds.conf.default"
        
        mkdir -p package/custom
        git clone --depth 1 https://github.com/vernesong/OpenClash.git package/custom/luci-app-openclash

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        
        cd openwrt
        if [ ! -f .config ]; then
          make defconfig
        fi

        # 强制开启插件
        sed -i 's/# CONFIG_PACKAGE_luci-app-passwall is not set/CONFIG_PACKAGE_luci-app-passwall=y/' .config
        sed -i 's/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray is not set/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y/' .config
        sed -i 's/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y/' .config
        sed -i 's/# CONFIG_PACKAGE_luci-app-openclash is not set/CONFIG_PACKAGE_luci-app-openclash=y/' .config

        # 强制开启镜像 (ISO & QCOW2)
        sed -i 's/# CONFIG_ISO_IMAGES is not set/CONFIG_ISO_IMAGES=y/' .config
        sed -i 's/# CONFIG_TARGET_IMAGES_QCOW2 is not set/CONFIG_TARGET_IMAGES_QCOW2=y/' .config
        
        # 调整分区大小 (不要太大，512M 足够)
        # 如果设太大 (比如 1024M)，生成的镜像文件也会变大，容易撑爆磁盘
        sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=16/CONFIG_TARGET_KERNEL_PARTSIZE=32/' .config
        sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=160/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' .config

        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 优先使用多线程，失败则回退到单线程
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        
        mkdir -p $GITHUB_WORKSPACE/uploads
        
        # 移动我们需要的文件
        mv *.iso $GITHUB_WORKSPACE/uploads/ 2>/dev/null || true
        mv *.qcow2 $GITHUB_WORKSPACE/uploads/ 2>/dev/null || true
        mv *.img.gz $GITHUB_WORKSPACE/uploads/ 2>/dev/null || true
        mv *.config $GITHUB_WORKSPACE/uploads/ 2>/dev/null || true
        
        echo "FIRMWARE=$GITHUB_WORKSPACE/uploads" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_Firmware_ISO_PVE
        path: ${{ env.FIRMWARE }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3
